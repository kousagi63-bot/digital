<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="404 — Page not found. The page you're looking for doesn't exist or has moved. Head back to Stackly Digital's homepage." />
  <title>404 — Page Not Found | Stackly Digital</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== 404 HERO ========== -->
  <header class="page-hero error-hero" id="top">
    <div class="hero__bg">
      <img src="images/hero-collaboration.webp" alt="" class="hero__bg-img" />
      <div class="hero__overlay"></div>
    </div>
    <div class="container">
      <a href="index.html" class="error-hero__logo" aria-label="Stackly Digital — back to homepage" data-hero="badge">
        <img src="images/logo.webp" alt="Stackly Digital logo" class="brand__logo" />
      </a>
      <div class="page-hero__content">
        <span class="error-hero__code" data-hero="badge">404</span>
        <h1 class="page-hero__title" data-hero="title">This page took a <span class="text-gradient">creative detour.</span></h1>
        <p class="page-hero__desc" data-hero="desc">
          The page you're looking for doesn't exist or has moved. No stress — let's get you back on the trail.
        </p>
        <div class="page-hero__actions" data-hero="actions">
          <button type="button" class="btn btn-gradient btn-lg" aria-label="Go back to the previous page"
                  onclick="if (window.history.length > 1) { history.back(); } else { window.location.href = 'index.html'; }">
            <i class="bi bi-arrow-left me-1"></i> Go Back
          </button>
          <a href="index.html" class="btn btn-outline-light btn-lg">Back to Home</a>
          <a href="contact.html" class="btn btn-outline-light btn-lg">Contact Us</a>
        </div>
        <div class="error-hero__quick" data-hero="actions">
          <span class="error-hero__hint">Popular pages</span>
          <a href="services.html"><i class="bi bi-gear"></i> Services</a>
          <a href="case-studies.html"><i class="bi bi-briefcase"></i> Case Studies</a>
          <a href="about.html"><i class="bi bi-people"></i> About</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <!-- Custom JS -->
  <script src="js/main.js"></script>
  <script src="js/reveal.js"></script>
</body>
</html>
